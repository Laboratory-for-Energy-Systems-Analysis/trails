name: Github Action
on: [push, pull_request]

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Black formatting
        uses: lgeiger/black-action@v1.0.1
        with:
          args: "./"

      - name: Check for modified files
        id: git-check
        run: |
          if git diff-index --quiet HEAD --; then
            echo "modified=false" >> $GITHUB_OUTPUT
          else
            echo "modified=true" >> $GITHUB_OUTPUT
            git diff --stat
            git diff --check
            exit 1
          fi

  # === CROSS-PLATFORM PYTEST ===
  build:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: clean
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install brightway25
          pip install -r requirements.txt
          pip install pytest pytest-forked
          pip install -e . --verbose

      # Create debug dir in a cross-platform way
      - name: Create debug directory
        run: python -c "import pathlib; p=pathlib.Path('pytest-debug'); p.mkdir(parents=True, exist_ok=True); print('Created', p.resolve())"

      # POSIX: run everything with subprocess isolation
      - name: Run tests (*nix, forked)
        if: runner.os != 'Windows'
        env:
          EI_USERNAME: ${{ secrets.EI_USERNAME }}
          EI_PASSWORD: ${{ secrets.EI_PASSWORD }}
          PYTEST_DEBUG_DIR: pytest-debug
        run: |
          python -c "import platform; print('Platform:', platform.platform())"
          pytest --forked -q

      # Windows: run without forking (either skip forked-marked tests or run all if safe)
      - name: Run tests (Windows, no fork)
        if: runner.os == 'Windows'
        env:
          EI_USERNAME: ${{ secrets.EI_USERNAME }}
          EI_PASSWORD: ${{ secrets.EI_PASSWORD }}
          PYTEST_DEBUG_DIR: pytest-debug
        run: |
          python -c "import platform; print('Platform:', platform.platform())"
          pytest -q -m "not forked"

      # Linux + macOS
      - name: List debug dir (diagnostics) — *nix
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in ["pytest-debug", "bw-work", "trails.log"]:
              d = Path(p)
              print(("[OK] " if d.exists() else "[MISS] ") + p)
              if d.is_dir():
                  for f in d.rglob("*"):
                      if f.is_file():
                          print("  -", f)
          PY

      # Windows
      - name: List debug dir (diagnostics) — Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $code = @"
          from pathlib import Path
          for p in ["pytest-debug", "bw-work", "trails.log"]:
            d = Path(p)
            print(("[OK] " if d.exists() else "[MISS] ") + p)
            if d.is_dir():
              for f in d.rglob("*"):
                if f.is_file():
                  print("  -", f)
          "@
          Set-Content -Path diag.py -Value $code -Encoding UTF8
          python diag.py

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-debug-${{ github.run_id }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest-debug/**
            trails.log
          include-hidden-files: true

  Pypi:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.11" ]
    steps:
      - uses: actions/checkout@v4
      - name: Install pypa/build
        run: python -m pip install build
      - name: Check release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('trails/__init__.py').read_text()); print(next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(getattr(target, 'id', None) == '__version__' for target in node.targets)))")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $VERSION does not match trails.__version__ $PACKAGE_VERSION"
            exit 1
          fi
      - name: Build a binary wheel and a source tarball
        run: python -m build
      - name: Check PyPI distribution name
        run: |
          DIST_NAME=$(python -c "import pathlib, re; print(re.search(r'(?m)^name = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text()).group(1))")
          if [ "$DIST_NAME" != "trails-lca" ]; then
            echo "PyPI distribution name must be trails-lca, got $DIST_NAME"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}" python - <<'PY'
          import email.parser
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          expected_name = "trails-lca"
          expected_version = os.environ["VERSION"]
          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist, got wheels={wheels}, sdists={sdists}"
              )

          with zipfile.ZipFile(wheels[0]) as zf:
              metadata_name = next(
                  name for name in zf.namelist() if name.endswith(".dist-info/METADATA")
              )
              wheel_metadata = email.parser.Parser().parsestr(
                  zf.read(metadata_name).decode()
              )

          with tarfile.open(sdists[0]) as tf:
              pkg_info_name = next(
                  name for name in tf.getnames() if name.endswith("/PKG-INFO")
              )
              pkg_info = tf.extractfile(pkg_info_name)
              assert pkg_info is not None
              sdist_metadata = email.parser.Parser().parsestr(
                  pkg_info.read().decode()
              )

          for label, metadata in (
              ("wheel", wheel_metadata),
              ("sdist", sdist_metadata),
          ):
              name = metadata["Name"]
              version = metadata["Version"]
              if name != expected_name or version != expected_version:
                  raise SystemExit(
                      f"{label} metadata is {name} {version}, "
                      f"expected {expected_name} {expected_version}"
                  )

          print(f"Verified {wheels[0].name} and {sdists[0].name}")
          PY
      - name: Publish distribution 📦 to PyPI if Release
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

  conda:
    name: (conda build)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.11" ]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,cmutel,konstantinstadler,haasad,pascallesage,romainsacchi
          allow-softlinks: true
          channel-priority: strict
          auto-update-conda: true
          activate-environment: test
      - name: Conda info
        shell: bash -l {0}
        run: conda info
      - name: Publish all variants 📦 to Anaconda if Release tag
        shell: bash -l {0}
        run: |
          PKG_NAME=trails-lca
          USER=romainsacchi
          conda install -y anaconda-client conda-build
          conda-build --version
          mkdir ~/conda-bld
          conda config --set anaconda_upload no
          export CONDA_BLD_PATH=~/conda-bld
          export VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('trails/__init__.py').read_text()); print(next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(getattr(target, 'id', None) == '__version__' for target in node.targets)))")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $VERSION does not match trails.__version__ $PACKAGE_VERSION"
            exit 1
          fi
          conda-build conda/ --old-build-string
          BUILT_PACKAGES=$(find $CONDA_BLD_PATH -type f \( -name "$PKG_NAME-$VERSION-*.tar.bz2" -o -name "$PKG_NAME-$VERSION-*.conda" \))
          if [ -z "$BUILT_PACKAGES" ]; then
            echo "No $PKG_NAME $VERSION conda package was built"
            exit 1
          fi
          echo "Built packages:"
          echo $BUILT_PACKAGES
          for PACKAGE in $BUILT_PACKAGES; do
            echo "Uploading $PACKAGE"
            anaconda -t ${{ secrets.ANACONDA_CLOUD }} upload -u $USER $PACKAGE --force
          done

  testconda:
    name: (conda test ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: conda
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11"]
        solver: ["classic"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,cmutel,konstantinstadler,haasad,pascallesage,romainsacchi
          allow-softlinks: true
          auto-update-conda: true
          activate-environment: test
          conda-solver: ${{ matrix.solver }}
      - name: Pull distribution 📦 from Anaconda and test it if Release tag
        shell: bash -l {0}
        run: |
          conda install -y "python==${{ matrix.python-version }}.*" romainsacchi::trails-lca
