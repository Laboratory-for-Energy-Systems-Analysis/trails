[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    dev
    profiling
    .git
    .venv venv
    build dist .eggs
markers =
    ecoinvent: requires local ecoinvent credentials/data
    forked: run this test in a fresh subprocess (POSIX only)
    serial: must not run concurrently with other tests
