package:
  name: trails-lca
  version: {{ environ.get('VERSION', '1.0.1') }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: python -m pip install --no-deps --ignore-installed .
  script_env:
    - VERSION
    - CONDA_BLD_PATH

requirements:
  host:
    - python >=3.10, <3.12
    - pip
    - setuptools

  run:
    - python >=3.10, <3.12
    - numpy >=1.24.4,<2.4
    - pandas
    - scipy >=1.10,<1.16
    - pyyaml
    - sparse >=0.13.0,<0.18
    - datapackage
    - bw2calc
    - bw2io
    - bw_processing
    - plotly
    - tqdm
    - xarray
    - dask >=2024.8,<2027
    - networkx
    - prettytable
    - fair
    - platformdirs
    - pyvis


test:
  imports:
    - trails

about:
  home: https://github.com/Laboratory-for-Energy-Systems-Analysis/trails
  license: MIT License
  license_family: MIT
  license_file: LICENSE.md
  summary: 'Temporal routing and aggregation of impacts across life-cycle systems'
