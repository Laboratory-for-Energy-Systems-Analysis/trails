package:
  name: trails
  version: {{ environ['VERSION'] }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: python -m pip install --no-deps --ignore-installed .
  script_env:
    - VERSION
    - CONDA_BLD_PATH

requirements:
  host:
    - python >=3.10, <3.12
    - pip
    - setuptools
    - bw2calc
    - bw2data

  run:
    - python >=3.10, <3.12
    - numpy >=1.24.4,<2.4
    - pandas
    - scipy >=1.10,<1.16
    - pyyaml
    - country_converter>=1.3.1
    - constructive_geometries>=1.0.0
    - prettytable
    - sparse >=0.13.0,<0.18
    - plotly
    - highspy
    - packaging
    - bw2calc
    - bw2data


test:
  imports:
    - trails

about:
  home: https://github.com/Laboratory-for-Energy-Systems-Analysis/trails
  license: MIT License
  summary: 'Edge-specific characterization factors for the LCA framework Brightway2'
license_family: MIT
